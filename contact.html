<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #131211;
  --ink-soft: #1d1b19;
  --cream: #f3ebdd;
  --cream-dim: #cfc6b4;
  --brass: #b8924f;
  --red: #8e2a2a;
  --blue: #1f3556;
  --serif: "Playfair Display", Georgia, "Times New Roman", serif;
  --text: "Lora", Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--cream);
  font-family: var(--text);
  font-size: 18px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
img { display: block; max-width: 100%; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }

/* barber-pole stripe */
.stripe {
  height: 8px;
  background: repeating-linear-gradient(-45deg, var(--red) 0 14px, var(--cream) 14px 28px, var(--blue) 28px 42px, var(--cream) 42px 56px);
}

.wrap { width: min(1080px, 100% - 40px); margin-inline: auto; }

/* header */
.site-header { border-bottom: 1px solid #2c2926; position: sticky; top: 0; background: rgba(19,18,17,.96); z-index: 10; }
.site-header .wrap { display: flex; align-items: center; justify-content: space-between; height: 72px; }
.brand { font-family: var(--serif); font-weight: 800; font-size: 26px; letter-spacing: .04em; text-decoration: none; }
.brand span { color: var(--brass); }
.nav { display: flex; gap: 32px; }
.nav a { text-decoration: none; font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: var(--cream-dim); padding: 6px 0; border-bottom: 1px solid transparent; }
.nav a:hover, .nav a[aria-current="page"] { color: var(--cream); border-bottom-color: var(--brass); }
.menu-btn { display: none; background: none; border: 1px solid #3a3631; color: var(--cream); padding: 8px 12px; font: inherit; font-size: 13px; letter-spacing: .15em; text-transform: uppercase; cursor: pointer; }

/* type */
.eyebrow { font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--brass); margin: 0 0 18px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 800; line-height: 1.08; margin: 0; }
h1 { font-size: clamp(48px, 9vw, 96px); letter-spacing: -.01em; }
h2 { font-size: clamp(30px, 4.5vw, 46px); }
.lead { color: var(--cream-dim); max-width: 34ch; font-size: 20px; margin: 22px 0 32px; font-style: italic; }
.rule { display: flex; align-items: center; gap: 14px; color: var(--brass); margin: 0 0 28px; }
.rule::before, .rule::after { content: ""; height: 1px; background: var(--brass); flex: 1; opacity: .5; }

/* buttons */
.btns { display: flex; flex-wrap: wrap; gap: 14px; }
.btn { display: inline-block; text-decoration: none; padding: 14px 28px; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; border: 1px solid var(--brass); transition: background .2s, color .2s; cursor: pointer; font-family: var(--text); background: none; color: var(--cream); }
.btn.solid { background: var(--brass); color: var(--ink); font-weight: 700; }
.btn:hover { background: var(--cream); color: var(--ink); border-color: var(--cream); }

/* hero */
.hero { padding: 72px 0 88px; }
.hero .wrap { display: grid; grid-template-columns: 1.1fr .9fr; gap: 64px; align-items: center; }
.frame { position: relative; }
.frame::before { content: ""; position: absolute; inset: 18px -18px -18px 18px; border: 1px solid var(--brass); z-index: 0; }
.frame img { position: relative; z-index: 1; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; filter: sepia(.12) contrast(1.03); }

/* sections */
section.block { padding: 88px 0; border-top: 1px solid #2c2926; }
.center { text-align: center; }
.menu { list-style: none; padding: 0; margin: 48px auto 0; max-width: 720px; }
.menu li { display: grid; grid-template-columns: 56px 1fr; gap: 8px 12px; padding: 24px 0; border-bottom: 1px dotted #4a443c; }
.menu .no { font-family: var(--serif); color: var(--brass); font-size: 22px; grid-row: span 2; }
.menu h3 { font-size: 24px; }
.menu p { margin: 0; color: var(--cream-dim); font-size: 16px; }

.gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 48px; }
.gallery figure { margin: 0; }
.gallery img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; filter: sepia(.12) contrast(1.03); border: 1px solid #3a3631; }
.gallery figcaption { margin-top: 12px; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--cream-dim); }

.cta { background: var(--cream); color: var(--ink); text-align: center; padding: 80px 0; }
.cta h2 { margin-bottom: 14px; }
.cta p { margin: 0 0 30px; font-style: italic; }
.cta .btn { color: var(--ink); border-color: var(--ink); }
.cta .btn.solid { background: var(--ink); color: var(--cream); }
.cta .btn:hover { background: var(--brass); border-color: var(--brass); color: var(--ink); }

/* contact page */
.contact { padding: 72px 0 96px; }
.contact .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: start; }
.phone { display: block; font-family: var(--serif); font-weight: 800; font-size: clamp(30px, 5vw, 46px); text-decoration: none; margin: 18px 0 26px; color: var(--brass); }
.phone:hover { color: var(--cream); }
.contact .photo img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; margin-top: 40px; border: 1px solid #3a3631; filter: sepia(.12) contrast(1.03); }
form { border: 1px solid var(--brass); padding: 32px; background: var(--ink-soft); }
form h2 { font-size: 28px; margin-bottom: 6px; }
form .sub { margin: 0 0 22px; color: var(--cream-dim); font-size: 15px; }
label { display: block; font-size: 12px; letter-spacing: .25em; text-transform: uppercase; color: var(--cream-dim); margin: 18px 0 6px; }
input, select, textarea { width: 100%; background: var(--ink); border: 1px solid #3a3631; color: var(--cream); padding: 12px 14px; font: inherit; font-size: 16px; border-radius: 0; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brass); }
form .btn { width: 100%; margin-top: 26px; text-align: center; }
.note { color: #e6a1a1; font-size: 14px; min-height: 20px; margin: 10px 0 0; }

/* footer */
.site-footer { padding: 36px 0; border-top: 1px solid #2c2926; text-align: center; color: var(--cream-dim); font-size: 14px; letter-spacing: .08em; }
.site-footer strong { font-family: var(--serif); color: var(--cream); letter-spacing: .06em; }

/* reveal */
.reveal { opacity: 0; transform: translateY(16px); transition: opacity .7s ease, transform .7s ease; }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } html { scroll-behavior: auto; } }

@media (max-width: 820px) {
  body { font-size: 17px; }
  .hero .wrap, .contact .wrap { grid-template-columns: 1fr; gap: 48px; }
  .frame::before { inset: 12px -10px -12px 10px; }
  .gallery { grid-template-columns: 1fr; }
  .menu-btn { display: block; }
  .nav { display: none; position: absolute; top: 72px; left: 0; right: 0; flex-direction: column; gap: 0; background: var(--ink); border-bottom: 1px solid #2c2926; padding: 8px 20px 16px; }
  .nav.open { display: flex; }
  .nav a { padding: 14px 0; border-bottom: 1px solid #2c2926; }
  .hero { padding: 48px 0 64px; }
  section.block { padding: 64px 0; }
}

/* language switch */
.lang { display: flex; margin-left: auto; margin-right: 0; border: 1px solid #3a3631; }
.lang button { background: none; border: 0; color: var(--cream-dim); font: inherit; font-size: 12px; letter-spacing: .18em; padding: 8px 12px; cursor: pointer; }
.lang button + button { border-left: 1px solid #3a3631; }
.lang button[aria-pressed="true"] { background: var(--brass); color: var(--ink); font-weight: 700; }
.lang button:not([aria-pressed="true"]):hover { color: var(--cream); }
.site-header .wrap { gap: 24px; }
.nav { margin-left: auto; }
.nav + .lang { margin-left: 0; }
@media (max-width: 820px) {
  .lang { margin-left: auto; }
  .menu-btn { margin-left: 4px; }
}

/* emblem (hero) */
.frame svg.emblem { position: relative; z-index: 1; display: block; width: 100%; height: auto; }

</style>

function setLang(l) {
  lang = l;
  const d = T[l];
  document.documentElement.lang = l;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = d[el.dataset.i18n]; });

  if (page) document.title = d['title.' + page];
  document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === l));

  if (note) note.textContent = '';
  try { localStorage.setItem('gx-lang', l); } catch (e) {}
}

  items.forEach((el) => io.observe(el));
} else {
  items.forEach((el) => el.classList.add('in'));
}

    const note = document.getElementById('note');
    if (!name) { note.textContent = T[lang]['err.name']; form.name.focus(); return; }
    note.textContent = '';
    window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(T[lang].wa(name, service, msg))}`, '_blank', 'noopener');
  });
}

</script>
